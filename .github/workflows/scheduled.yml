name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!250.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '43 1 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@e410a65c9ab14c946834ad194d9ddef5a3bc611f
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@e410a65c9ab14c946834ad194d9ddef5a3bc611f
    with:
      age_days: 30
      dry_run: false
