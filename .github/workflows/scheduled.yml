name: Scheduled

# Replaces the GitLab weekly pipeline schedule, deactivated in terraform!250.
# Same cron terraform derived for it, so the cadence is unchanged.

on:
  schedule:
    - cron: '43 1 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    uses: tnoff/github-workflows/.github/workflows/renovate.yml@b2f9fe9ca011e5fdf04f82f3d14c8e499c7918e6
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}

  branch-cleanup:
    name: Branch cleanup
    permissions:
      contents: write
      pull-requests: read
    uses: tnoff/github-workflows/.github/workflows/branch-cleanup.yml@b2f9fe9ca011e5fdf04f82f3d14c8e499c7918e6
    with:
      age_days: 30
      dry_run: false
