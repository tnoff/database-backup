name: CI

# Pull-request checks, ported from .gitlab-ci.yml.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A PR that touches only catalog-info.yaml or renovate.json changes nothing any
  # job here inspects: no source, no image input, no packaging metadata, no
  # workflow. So all of them gate on this and CI reduces to the aggregate.
  #
  # This MUST stay a job-level `if:` and never become a workflow-level
  # `paths-ignore`. The branch ruleset requires the `CI result` context;
  # `paths-ignore` stops the whole workflow, so that context never reports at all
  # -- and a required check that never reports blocks the PR forever, where a
  # SKIPPED job scores as success. The two failure modes look nothing alike.
  #
  # Two files, named exactly, anchored. Not a prefix, not a glob, not a
  # deny-list of "things that feel unimportant": a list that grows by feel is one
  # somebody eventually adds a file to that did matter.
  #
  # An empty or unreadable diff yields false, which runs everything.
  metadata:
    name: Detect metadata-only change
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      only: ${{ steps.filter.outputs.only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          FILES="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          ONLY=false
          if [ -n "${FILES}" ]; then
            OTHER="$(printf '%s\n' "${FILES}" | grep -vE '^(catalog-info\.yaml|renovate\.json)$' || true)"
            [ -z "${OTHER}" ] && ONLY=true
          fi
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "metadata-only: ${ONLY}"
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"

  secrets:
    name: Scan for secrets
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@8f112893cd17d68fe039d3ba2643d2881bfafdcb

  # Reimplements the .image-build-rules `changes:` block: only rebuild when
  # something that can alter the image changed. Doc-only, renovate.json and
  # workflow-pin PRs skip the build, exactly as on GitLab.
  #
  # Done with git rather than a path-filter action to avoid another pinned
  # dependency for ~10 lines of shell. A workflow-level `paths:` filter would
  # be wrong here: it would gate the secret scan and bump-version too.
  changes:
    name: Detect image-input changes
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          MATCH=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              Dockerfile|requirements.txt|files/*) MATCH=true; break ;;
            esac
          done <<< "$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "image inputs changed: ${MATCH}"
          echo "image=${MATCH}" >> "$GITHUB_OUTPUT"

  # The GitLab config ran the image build and the image scan as two jobs, with
  # the built image shipped between them as a tarball through an object-storage
  # bucket. docker-build-check does both in one job, so the bucket, the upload
  # and the download are gone.
  #
  # NOTE: this job is conditional, so it must never be added to
  # required_status_checks -- a required check that skips blocks the merge.
  build:
    name: Build and scan image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: tnoff/github-workflows/.github/workflows/docker-build-check.yml@8f112893cd17d68fe039d3ba2643d2881bfafdcb

  bump-version:
    name: Bump version
    if: startsWith(github.head_ref, 'renovate/dev-')
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@8f112893cd17d68fe039d3ba2643d2881bfafdcb
    with:
      bump_changelog: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  # Catches a `uses:` whose inputs or secrets no longer match the pinned callee.
  # That mismatch fails the calling workflow at STARTUP -- no job is created, no
  # check reports, and no `workflow_run` event fires -- so neither this checks
  # list nor notify-failure.yml can see it. It is how one upstream secret rename
  # left `Release` dead in nine repos for five days in September 2026.
  contracts:
    name: Workflow contracts
    needs: metadata
    if: needs.metadata.outputs.only != 'true'
    uses: tnoff/github-workflows/.github/workflows/check-workflow-contracts.yml@8f112893cd17d68fe039d3ba2643d2881bfafdcb

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # The image build is conditional on `changes`, so it is `skipped` on a
    # PR that touches no image input -- correct, and why skipped passes below.
    # It is also why the build legs must never be required by name: they
    # would pass vacuously.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, changes, build, contracts, metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets:   ${{ needs.secrets.result }}"
          echo "metadata:  ${{ needs.metadata.result }}"
          echo "changes:   ${{ needs.changes.result }}"
          echo "build:     ${{ needs.build.result }}"
          echo "contracts: ${{ needs.contracts.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.build.result == 'failure' || needs.build.result == 'cancelled' ||
          needs.contracts.result == 'failure' || needs.contracts.result == 'cancelled' ||
          needs.metadata.result == 'failure' || needs.metadata.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
