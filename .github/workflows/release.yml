name: Release

# Runs on the default branch: fold the changelog, tag, release, then build and
# push the image and ask docker-apps to bump its pin.
#
# ---------------------------------------------------------------------------
# The fold guard
# ---------------------------------------------------------------------------
# assemble-changelog pushes a "docs: assemble changelog for X" commit to main,
# which triggers this workflow a SECOND time. That second pass is what cuts the
# tag and the release, because tag defers while fragments are still pending.
#
# But the image must NOT be built and pushed twice, and docker-apps must not be
# asked to bump twice. The GitLab config guarded this with a repo-local
# `.not-on-changelog-fold` rule matching the commit message; this is the same
# guard against github.event.head_commit.message. Without it every release
# pushes two images and opens two bump MRs.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  tag:
    name: Tag
    needs: assemble-changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/tag.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      gate_on_fragments: true
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  release:
    name: Release
    needs: tag
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/release.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      version: ${{ needs.tag.outputs.version }}
      tag_created: ${{ needs.tag.outputs.tag_created }}

  push-image:
    name: Push image
    if: "${{ !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}"
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    # registry / namespace / repo_name are INPUTS, not secrets. GitHub refuses
    # to set a job output containing secret material, so while they were
    # secrets the `image` output below came back empty and trigger-bump sent a
    # blank IMAGE_NAME to docker-apps. See github-workflows!98.
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME }}
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  trigger-bump:
    name: Trigger docker-apps bump
    needs: push-image
    uses: tnoff/github-workflows/.github/workflows/trigger-bump.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      bump_source: database-backup
      image: ${{ needs.push-image.outputs.image }}
      image_tag: ${{ needs.push-image.outputs.secondary_tag }}
      target_project_id: ${{ vars.DOCKER_APPS_PROJECT_ID }}
    secrets:
      trigger_token: ${{ secrets.DOCKER_APPS_TRIGGER_TOKEN }}
