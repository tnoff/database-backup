name: Release

# Runs on the default branch: fold the changelog, tag, release, then build and
# push the image and ask docker-apps to bump its pin.
#
# ---------------------------------------------------------------------------
# The fold guard
# ---------------------------------------------------------------------------
# assemble-changelog pushes a "docs: assemble changelog for X" commit to main,
# which triggers this workflow a SECOND time. That second pass is what cuts the
# tag and the release, because tag defers while fragments are still pending.
#
# But the image must NOT be built and pushed twice, and docker-apps must not be
# asked to bump twice. The GitLab config guarded this with a repo-local
# `.not-on-changelog-fold` rule matching the commit message; this is the same
# guard against github.event.head_commit.message. Without it every release
# pushes two images and opens two bump MRs.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Skip the image build when the commit did not touch anything the image is
  # built from. Without this a metadata-only merge -- a catalog descriptor, a
  # README -- folds a changelog, cuts a tag, rebuilds the image and bumps a
  # production pin in docker-apps for content no image contains.
  #
  # The same filter already exists in ci.yml as the `changes` job, and it works:
  # the build correctly skips on a docs-only PR. It was never wired into the
  # release path, so the saving stopped at the PR and the merge rebuilt anyway.
  # That is the shape worth remembering -- a control present where you watch the
  # checks and absent where the work actually happens.
  #
  # The keep-list below is copied from ci.yml's `changes` job and must stay
  # identical to it. If the two drift, a PR can build an image that its own merge
  # then refuses to rebuild.
  #
  # Two differences from ci.yml's copy, both forced by the event: the base is
  # github.event.before compared two-dot rather than a PR base ref, and this one
  # FAILS OPEN. An absent, all-zeros or unreachable base builds anyway. A build
  # that did not need to happen costs minutes; a build that silently did not
  # happen leaves docker-apps pinned to a stale image and reads exactly like a
  # successful run.
  changes:
    name: Detect image-input changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ] \
             || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "no usable base ref (${BEFORE:-empty}) -- building"
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "${BEFORE}" "${AFTER}")"
          MATCH=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              Dockerfile|requirements.txt|files/*) MATCH=true; break ;;
            esac
          done <<< "${FILES}"
          echo "changed files:"
          printf '%s\n' "${FILES}" | sed -n 's/^/  /p'
          echo "image inputs changed: ${MATCH}"
          echo "image=${MATCH}" >> "$GITHUB_OUTPUT"

  assemble-changelog:
    name: Assemble changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/assemble-changelog.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  tag:
    name: Tag
    needs: assemble-changelog
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/tag.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2
    with:
      gate_on_fragments: true
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  release:
    name: Release
    needs: tag
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/release.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2
    with:
      version: ${{ needs.tag.outputs.version }}
      tag_created: ${{ needs.tag.outputs.tag_created }}

  push-image:
    name: Push image
    needs: changes
    if: >-
      ${{ needs.changes.outputs.image == 'true'
          && !startsWith(github.event.head_commit.message, 'docs: assemble changelog') }}
    uses: tnoff/github-workflows/.github/workflows/docker-push.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2
    # registry / namespace / repo_name are INPUTS, not secrets. GitHub refuses
    # to set a job output containing secret material, so while they were
    # secrets the `image` output below came back empty and trigger-bump sent a
    # blank IMAGE_NAME to docker-apps. See github-workflows!98.
    with:
      registry: ${{ vars.OCI_REGISTRY }}
      namespace: ${{ vars.OCI_NAMESPACE }}
      repo_name: ${{ vars.OCI_REPO_NAME }}
    secrets:
      oci_username: ${{ secrets.OCI_USERNAME }}
      oci_token: ${{ secrets.OCI_TOKEN }}

  trigger-bump:
    name: Trigger docker-apps bump
    needs: push-image
    uses: tnoff/github-workflows/.github/workflows/trigger-bump-dispatch.yml@0d92c3c09cf7dd78ce36cb5f40618e7fc296e6a2
    with:
      bump_source: database-backup
      image: ${{ needs.push-image.outputs.image }}
      image_tag: ${{ needs.push-image.outputs.secondary_tag }}
    secrets:
      app_client_id: ${{ secrets.CI_APP_CLIENT_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}
